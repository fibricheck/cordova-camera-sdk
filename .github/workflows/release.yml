on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: Release & Publish @fibricheck/cordova-camera-sdk
jobs:
  release-new-version:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v3
        with:
          command: manifest

  publish-gpr:
    runs-on: ubuntu-latest
    needs: release-new-version
    if: ${{needs.release-new-version.outputs.release_created}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 14
          registry-url: https://npm.pkg.github.com/
          scope: '@fibricheck'
      - run: yarn install
      - run: yarn build
      - run: yarn publish --registry https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
